[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uxsentinel-studio"
version = "1.0.0"
description = "Web Application & Live Mission Control SPA para o UXSentinel"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Equipe UXSentinel", email = "contato@gotryx.com.br" }
]
keywords = [
    "qa",
    "ux",
    "fastapi",
    "vue3",
    "visual-testing",
    "studio",
    "uxsentinel"
]
dependencies = [
    "uxsentinel>=1.1.7",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
uxsentinel-studio = "uxsentinel_studio.cli:main"

[tool.uv.sources]
uxsentinel = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["uxsentinel_studio*"]

[tool.setuptools.package-data]
uxsentinel_studio = [
    "static/**/*",
]
